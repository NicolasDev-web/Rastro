name: demo-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python pipelines/validate/check_fixture.py
      - run: python -m unittest discover -s pipelines/tests -v
      - run: python -m unittest discover -s services/api/tests -v
  web:
    # Fixo em 24.04: o Playwright 1.60 não instala o Chromium no ubuntu-latest (26.04) em 24/11/2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: node --test scripts/validation-bundle.test.mjs scripts/build-publicado.test.mjs
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      # Navegação, 1440/768/360 px, teclado, CSV, 404 e acessibilidade (axe) no build de demonstração.
      # data/publicado/ não está no Git; o site publicado é verificado à mão após cada deploy (SPEC 06).
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright==1.60.0 && python -m playwright install --with-deps chromium
      - name: Navegação e acessibilidade (demo)
        working-directory: apps/web
        run: |
          npx next start -p 3001 > ../../next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/ > /dev/null && break; sleep 1; done
          python ../../scripts/verify_web.py --mode demo
          python ../../scripts/verify_a11y.py --mode demo
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-demo
          path: |
            output/qa/demo
            next-start.log
